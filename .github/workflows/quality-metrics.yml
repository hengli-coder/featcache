# Quality Metrics — weekly summary of lint governance status
name: Quality Metrics

on:
  schedule:
    # Every Monday at 09:00 UTC
    - cron: '0 9 * * 1'
  workflow_dispatch: # manual trigger

permissions:
  contents: read
  issues: write

jobs:
  metrics:
    name: Lint Quality Metrics
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Collect lint metrics
        id: metrics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="${{ github.repository }}"

          # Fetch all lint-related issues
          TOTAL_OPEN=$(gh issue list --label lint --state open --json number --jq 'length' 2>/dev/null || echo 0)
          TOTAL_CLOSED=$(gh issue list --label lint --state closed --json number --jq 'length' 2>/dev/null || echo 0)
          P0_OPEN=$(gh issue list --label lint/critical --state open --json number --jq 'length' 2>/dev/null || echo 0)
          P1_OPEN=$(gh issue list --label lint/high --state open --json number --jq 'length' 2>/dev/null || echo 0)
          P2_OPEN=$(gh issue list --label lint/medium --state open --json number --jq 'length' 2>/dev/null || echo 0)
          P3_OPEN=$(gh issue list --label lint/low --state open --json number --jq 'length' 2>/dev/null || echo 0)

          echo "## Lint Quality Metrics" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| 🔴 P0 Critical (open) | $P0_OPEN |" >> $GITHUB_STEP_SUMMARY
          echo "| 🟠 P1 High (open) | $P1_OPEN |" >> $GITHUB_STEP_SUMMARY
          echo "| 🟡 P2 Medium (open) | $P2_OPEN |" >> $GITHUB_STEP_SUMMARY
          echo "| ⚪ P3 Low (open) | $P3_OPEN |" >> $GITHUB_STEP_SUMMARY
          echo "| **Total open** | **$TOTAL_OPEN** |" >> $GITHUB_STEP_SUMMARY
          echo "| Total closed | $TOTAL_CLOSED |" >> $GITHUB_STEP_SUMMARY

          echo "p0=$P0_OPEN" >> $GITHUB_OUTPUT
          echo "p1=$P1_OPEN" >> $GITHUB_OUTPUT
          echo "p2=$P2_OPEN" >> $GITHUB_OUTPUT
          echo "p3=$P3_OPEN" >> $GITHUB_OUTPUT
          echo "total_open=$TOTAL_OPEN" >> $GITHUB_OUTPUT

      - name: Create metrics issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE=$(date -u +%Y-%m-%d)
          gh issue create \
            --title "Lint Quality Metrics — $DATE" \
            --label "lint,metrics" \
            --body "## Lint Quality Metrics — $DATE

          ### Current Status

          | Severity | Open |
          |----------|------|
          | 🔴 P0 Critical | ${{ steps.metrics.outputs.p0 }} |
          | 🟠 P1 High | ${{ steps.metrics.outputs.p1 }} |
          | 🟡 P2 Medium | ${{ steps.metrics.outputs.p2 }} |
          | ⚪ P3 Low | ${{ steps.metrics.outputs.p3 }} |
          | **Total** | **${{ steps.metrics.outputs.total_open }}** |

          ### Repository
          ${{ github.repository }}

          ---
          _Auto-generated by the Quality Metrics workflow._"