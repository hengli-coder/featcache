version: "2"
linters:
  enable:
    - bodyclose
    - gosec
    - misspell
    - prealloc
    - revive
    - unconvert
  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true
    staticcheck:
      checks:
        - all
        - -SA1029
    gosec:
      excludes:
        - G115
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - errcheck
          - gosec
        path: _test\.go
      - linters:
          - errcheck
        path: cmd/featload/
      - linters:
          - errcheck
        path: pkg/featcache/server\.go
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - github.com/hengli-coder/featcache
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
